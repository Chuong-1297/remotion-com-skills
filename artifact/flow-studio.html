<style>
/* Layout: editing-suite grid — media bin | monitor | inspector, timeline strip and prompt deck below. Dark by choice (a grading room). */
:root {
  --ink: #0e0d0c;          /* page */
  --deck: #171513;         /* panels */
  --deck-2: #211e1b;       /* raised controls */
  --rule: #2f2b27;         /* hairlines */
  --paper: #f1ebe3;        /* text */
  --dim: #9c938a;          /* secondary text */
  --tungsten: #f0a04b;     /* accent: tungsten lamp */
  --tungsten-ink: #1a1007; /* text on accent */
  --cut: #ff6b5a;          /* destructive */
  --ok: #8fd18b;
  --font-ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--paper); font-family: var(--font-ui); font-size: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--tungsten); outline-offset: 2px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.app {
  height: 100%; display: grid; gap: 10px;
  grid-template-columns: 230px minmax(0, 1fr) 300px;
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  grid-template-areas: "top top top" "bin stage insp" "tl tl tl" "prompt prompt prompt";
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { grid-area: top; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; letter-spacing: -.01em; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--tungsten); color: var(--tungsten-ink); display: grid; place-items: center; }
.title-in { background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 5px 8px; font-weight: 600; min-width: 0; width: 220px; max-width: 100%; }
.title-in:hover, .title-in:focus { border-color: var(--rule); outline: none; }
.spacer { flex: 1; }

.panel { background: var(--deck); border: 1px solid var(--rule); border-radius: var(--r); min-width: 0; min-height: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }

.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--rule); background: var(--deck-2); font-weight: 600; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: #4a443d; }
.btn.hot { background: var(--tungsten); color: var(--tungsten-ink); border-color: transparent; }
.btn.hot:hover:not(:disabled) { filter: brightness(1.07); }
.btn.sm { padding: 5px 9px; font-size: 12.5px; }
.ibtn { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--dim); }
.ibtn:hover:not(:disabled) { background: var(--deck-2); color: var(--paper); }
.ibtn.danger:hover:not(:disabled) { color: var(--cut); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; padding: 2px; background: var(--deck); }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; color: var(--dim); font-weight: 600; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--deck-2); color: var(--paper); }

/* media bin */
.bin { grid-area: bin; display: flex; flex-direction: column; }
.bin-grid { padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; overflow: auto; align-content: start; }
.media { position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 1; background: var(--deck-2); border: 1px solid var(--rule); }
.media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.media .tag.r { left: auto; right: 5px; color: var(--paper); font-family: var(--font-code); }
.media .tag { position: absolute; left: 5px; top: 5px; font-size: 10px; font-weight: 700; background: rgba(14,13,12,.75); color: var(--tungsten); padding: 1px 6px; border-radius: 99px; }
.media .acts { position: absolute; inset: auto 0 0 0; display: flex; justify-content: space-between; padding: 4px; background: linear-gradient(transparent, rgba(0,0,0,.75)); opacity: 0; transition: opacity .15s; }
.media:hover .acts, .media:focus-within .acts { opacity: 1; }
.media .acts button { border: 0; border-radius: 6px; background: rgba(241,235,227,.92); color: var(--tungsten-ink); font-size: 11px; font-weight: 700; padding: 3px 7px; display: inline-flex; align-items: center; gap: 4px; }
.media .acts button.x { background: rgba(14,13,12,.8); color: var(--paper); }
.drop { margin: 10px 10px 0; border: 1.5px dashed #4a443d; border-radius: 8px; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--dim); background: transparent; width: calc(100% - 20px); }
.drop:hover, .drop.over { border-color: var(--tungsten); color: var(--paper); }

/* stage */
.stage { grid-area: stage; display: flex; flex-direction: column; }
.monitor { flex: 1; min-height: 0; display: grid; place-items: center; padding: 12px; background: repeating-linear-gradient(45deg, #121110 0 10px, #141311 10px 20px); border-radius: var(--r) var(--r) 0 0; }
.monitor canvas { max-width: 100%; max-height: 100%; background: #000; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,.6); display: block; }
.transport { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--rule); }
.tc { font-family: var(--font-code); font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--dim); white-space: nowrap; }
.tc b { color: var(--paper); font-weight: 500; }
.scrub { flex: 1; accent-color: var(--tungsten); min-width: 60px; }

/* inspector */
.insp { grid-area: insp; display: flex; flex-direction: column; }
.insp-body { overflow: auto; padding: 4px 12px 12px; }
.insp section { padding: 10px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 9px; }
.insp section:last-child { border-bottom: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row label, .lbl { color: var(--dim); font-size: 12.5px; }
.sel { background: var(--deck-2); border: 1px solid var(--rule); border-radius: 7px; padding: 5px 7px; font-size: 13px; max-width: 160px; }
.rng { display: grid; gap: 3px; }
.rng input { width: 100%; accent-color: var(--tungsten); }
.txt { width: 100%; background: var(--deck-2); border: 1px solid var(--rule); border-radius: 8px; padding: 7px 9px; resize: vertical; min-height: 54px; }
.empty-note { color: var(--dim); padding: 16px 0; line-height: 1.55; }

/* timeline */
.tl { grid-area: tl; }
.tl-h { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.track { position: relative; display: flex; gap: 5px; padding: 10px 12px; overflow-x: auto; min-height: 92px; }
.clip { position: relative; flex: none; height: 70px; border-radius: 7px; overflow: hidden; border: 2px solid transparent; background: var(--deck-2); cursor: grab; padding: 0; }
.clip img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; filter: saturate(.9); }
.clip[aria-selected="true"] { border-color: var(--tungsten); }
.clip .meta { position: absolute; left: 4px; bottom: 4px; font-family: var(--font-code); font-size: 10.5px; background: rgba(14,13,12,.8); border-radius: 4px; padding: 1px 5px; font-variant-numeric: tabular-nums; }
.clip .num { position: absolute; right: 4px; top: 4px; font-size: 10px; font-weight: 700; background: rgba(14,13,12,.8); border-radius: 4px; padding: 0 5px; }
.clip .tx { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--tungsten); opacity: .8; }
.clip.dragging { opacity: .35; }
.playhead { position: absolute; top: 4px; bottom: 4px; width: 2px; background: var(--paper); border-radius: 2px; pointer-events: none; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
.track-empty { color: var(--dim); align-self: center; }

/* prompt deck */
.prompt { grid-area: prompt; padding: 10px; display: grid; gap: 8px; }
.prompt-row { display: flex; gap: 10px; align-items: flex-end; }
.prompt textarea { flex: 1; min-width: 0; resize: none; background: transparent; border: 0; padding: 6px 4px; font-size: 15px; line-height: 1.45; min-height: 46px; max-height: 140px; outline: none; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--rule); background: transparent; color: var(--dim); border-radius: 99px; padding: 4px 10px; font-size: 12px; }
.chip:hover { color: var(--paper); border-color: #4a443d; }
.status { font-size: 12.5px; color: var(--dim); min-height: 18px; }
.status.err { color: var(--cut); }
.status.ok { color: var(--ok); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
.check input { accent-color: var(--tungsten); }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal { width: 100%; max-width: 460px; background: var(--deck); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
.modal h3 { margin: 0; font-size: 17px; text-wrap: balance; }
.modal p { margin: 0; color: var(--dim); line-height: 1.5; }
.bar { height: 8px; background: var(--deck-2); border-radius: 99px; overflow: hidden; }
.bar div { height: 100%; width: 0; background: var(--tungsten); transition: width .2s; }
.modal video { width: 100%; border-radius: 8px; background: #000; max-height: 45vh; }
.modal-acts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

/* AI features */
.checker { background-color: #24221f; background-image: linear-gradient(45deg, #34312d 25%, transparent 25%), linear-gradient(-45deg, #34312d 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #34312d 75%), linear-gradient(-45deg, transparent 75%, #34312d 75%); background-size: 14px 14px; background-position: 0 0, 0 7px, 7px -7px, -7px 0; }
.ai-canvas { width: 100%; max-height: 40vh; object-fit: contain; border-radius: 8px; background-color: #000; }
.ai-msg { font-size: 13px; }
.ov-item { border: 1px solid var(--rule); border-radius: 8px; padding: 6px 8px; display: grid; gap: 8px; }
.ov-item.open { border-color: var(--tungsten); }
.ov-head { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; font-weight: 600; font-size: 13px; flex: 1; text-align: left; }
.ov-head img { width: 30px; height: 30px; object-fit: contain; border-radius: 5px; }
.media .acts { gap: 3px; }
@media (max-width: 960px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: none;
    grid-template-areas: "top" "stage" "prompt" "tl" "insp" "bin"; }
  .monitor { min-height: 220px; }
  .bin-grid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
  .insp-body { max-height: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="brand-mark"><svg class="i"><use href="#i-film"/></svg></span>Flow Studio</div>
    <input class="title-in" id="title" aria-label="Tên video" value="Hành trình mùa hè">
    <div class="seg" role="group" aria-label="Khung hình">
      <button id="ar169" aria-pressed="true">16:9</button>
      <button id="ar916" aria-pressed="false">9:16</button>
    </div>
    <div class="spacer"></div>
    <button class="btn sm" id="undoBtn" disabled title="Hoàn tác thay đổi gần nhất của Claude"><svg class="i"><use href="#i-undo"/></svg>Hoàn tác</button>
    <label class="btn sm" for="musicIn" title="Nhạc nền (chỉ trong phiên này)"><svg class="i"><use href="#i-music"/></svg><span id="musicLbl">Nhạc nền</span></label>
    <input type="file" id="musicIn" accept="audio/*" hidden>
    <button class="btn hot" id="exportBtn"><svg class="i"><use href="#i-down"/></svg>Xuất video</button>
  </header>

  <aside class="panel bin" aria-label="Thư viện">
    <div class="panel-h"><span class="eyebrow">Thư viện</span><span class="tc" id="mediaCount"></span></div>
    <button class="drop" id="dropZone"><svg class="i"><use href="#i-up"/></svg>Tải ảnh / video</button>
    <input type="file" id="fileIn" accept="image/*,video/*" multiple hidden>
    <div class="bin-grid" id="binGrid"></div>
  </aside>

  <section class="panel stage" aria-label="Xem trước">
    <div class="monitor"><canvas id="cv" width="1280" height="720"></canvas></div>
    <div class="transport">
      <button class="ibtn" id="playBtn" aria-label="Phát"><svg class="i"><use href="#i-play" id="playIco"/></svg></button>
      <input type="range" class="scrub" id="scrub" min="0" max="1000" value="0" aria-label="Vị trí phát">
      <span class="tc"><b id="tcNow">0:00.0</b> / <span id="tcTotal">0:00.0</span></span>
    </div>
  </section>

  <aside class="panel insp" aria-label="Chỉnh cảnh">

      <div style="display:flex;gap:2px">
        <button class="ibtn" id="mvL" aria-label="Dời sang trái"><svg class="i"><use href="#i-left"/></svg></button>
        <button class="ibtn" id="mvR" aria-label="Dời sang phải"><svg class="i"><use href="#i-right"/></svg></button>
        <button class="ibtn" id="dupBtn" aria-label="Nhân đôi cảnh"><svg class="i"><use href="#i-copy"/></svg></button>
        <button class="ibtn danger" id="delBtn" aria-label="Xoá cảnh"><svg class="i"><use href="#i-trash"/></svg></button>
      </div>
    </div>

  </aside>

    <div class="track" id="track"></div>
  </section>

    <div class="prompt-row">
      <textarea id="promptIn" rows="2" placeholder="Mô tả video bạn muốn, hoặc yêu cầu sửa: “Làm video du lịch 20 giây, nhịp nhanh, thêm chữ cho từng cảnh”"></textarea>
      <button class="btn hot" id="genBtn"><svg class="i"><use href="#i-spark"/></svg>Tạo với Claude</button>
    </div>
    <div class="chips">
      <button class="chip" data-p="Dựng video du lịch khoảng 20 giây, nhịp vừa, mỗi cảnh một câu chữ ngắn đầy cảm xúc.">Video du lịch</button>
      <button class="chip" data-p="Biến các ảnh thành video quảng cáo sản phẩm 15 giây, chữ to, chuyển cảnh nhanh, kết thúc bằng lời kêu gọi hành động.">Quảng cáo 15s</button>
      <button class="chip" data-p="Làm video kỷ niệm ấm áp, chậm rãi, màu hoài cổ, chữ nhỏ ở dưới.">Kỷ niệm hoài cổ</button>
      <button class="chip" data-p="Giữ nguyên thứ tự, chỉ viết lại chữ cho từng cảnh hay hơn và thêm chuyển động phù hợp.">Viết lại chữ</button>

      <label class="check"><input type="checkbox" id="sendImgs" checked> Cho Claude xem ảnh</label>
    </div>
    <div class="status" id="status" role="status"></div>
  </section>
</div>

  function sanitize(res, mediaForClaude) {

  // ---------- AI: background removal, motion learning, puppets, 3D character ----------
  // MediaPipe runtime and models ship as files next to this page (mp/, models/); the JS bundle and three.js come from jsDelivr.

  const motionCache = {};

  let mpPromise = null;
  function loadMP() {

    const mk = (delegate) => mod.PoseLandmarker.createFromOptions(fileset, { baseOptions: { modelAssetBuffer: buf, delegate }, runningMode: 'VIDEO', numPoses: 1 });

  // ----- masks -----
  function maskFrom(result) {
    const mk = result && result.confidenceMasks && result.confidenceMasks[0];

    const w = mk.width, h = mk.height, data = mk.getAsFloat32Array();
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); const img = x.createImageData(w, h);
    for (let i = 0; i < w * h; i++) img.data[i * 4 + 3] = clamp((data[i] - 0.35) / 0.3, 0, 1) * 255;

    if (!mask) return null;
    const k = Math.min(1, maxSide / Math.max(iw, ih));
    const c = document.createElement('canvas'); c.width = Math.round(iw * k); c.height = Math.round(ih * k);

  const segCache = new Map();

    if (!c) {

  // ----- modal for long AI jobs -----
  function aiModal(title, msg) {
    const wrap = document.createElement('div'); wrap.className = 'scrim';

  const seekEl = (v, t) => new Promise((r) => { const f = () => { v.removeEventListener('seeked', f); r(); }; v.addEventListener('seeked', f); v.currentTime = t; });
  const BONES2D = [[11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 23], [12, 24], [23, 24], [23, 25], [25, 27], [24, 26], [26, 28]];

  async function cutoutMedia(id) {

  async function learnMotion(id) {
    const m = mediaById(id);
    if (!m || !m.url) return;
    const ui = aiModal('Học chuyển động từ video', 'Đang tải AI nhận dạng dáng người (chỉ lần đầu)…');
    try {
      const pose = await loadPose();
      const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = m.url;
      await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error('Không đọc được video')); });

    const basis = (r, u) => { const x = r.clone().normalize(), z = new T.Vector3().crossVectors(x, u).normalize(), y = new T.Vector3().crossVectors(z, x).normalize(); return new T.Quaternion().setFromRotationMatrix(new T.Matrix4().makeBasis(x, y, z)); };
    const setW = (b, w) => { const pq = b.parent ? b.parent.getWorldQuaternion(new T.Quaternion()) : new T.Quaternion(); b.quaternion.copy(pq.invert().multiply(w)); b.updateMatrixWorld(true); };
    const has = (...k) => k.every((x) => bones[x]);
    const hip = mid3(23, 24), sh = mid3(11, 12), headC = mid3(7, 8).lerp(V(0), 0.3), up = sh.clone().sub(hip);
    if (has('hips', 'lUpperLeg', 'rUpperLeg', 'chest')) setW(bones.hips, basis(V(23).sub(V(24)), up).multiply(basis(rp.lUpperLeg.clone().sub(rp.rUpperLeg), rp.chest.clone().sub(rp.hips)).invert()).multiply(rq.hips));
    if (has('chest', 'lUpperArm', 'rUpperArm', 'neck', 'spine')) setW(bones.chest, basis(V(11).sub(V(12)), up).multiply(basis(rp.lUpperArm.clone().sub(rp.rUpperArm), rp.neck.clone().sub(rp.spine)).invert()).multiply(rq.chest));
    if (has('neck', 'head')) setW(bones.neck, new T.Quaternion().setFromUnitVectors(rp.head.clone().sub(rp.neck).normalize(), headC.clone().sub(sh).normalize()).multiply(rq.neck));
    if (has('head', 'headTop')) setW(bones.head, basis(V(7).sub(V(8)), headC.clone().sub(sh)).multiply(basis(new T.Vector3(1, 0, 0), rp.headTop.clone().sub(rp.head)).invert()).multiply(rq.head));
    const L = [['lUpperArm', 'lLowerArm', 11, 13], ['lLowerArm', 'lHand', 13, 15], ['rUpperArm', 'rLowerArm', 12, 14], ['rLowerArm', 'rHand', 14, 16],
      ['lUpperLeg', 'lLowerLeg', 23, 25], ['lLowerLeg', 'lFoot', 25, 27], ['lFoot', 'lToe', 27, 31], ['rUpperLeg', 'rLowerLeg', 24, 26], ['rLowerLeg', 'rFoot', 26, 28], ['rFoot', 'rToe', 28, 32]];
    for (const [b, c, a, z] of L) {
      if (!has(b, c)) continue;
      const d = V(z).sub(V(a)); if (d.lengthSq() < 1e-8) continue;
      setW(bones[b], new T.Quaternion().setFromUnitVectors(rp[c].clone().sub(rp[b]).normalize(), d.normalize()).multiply(rq[b]));
    }
    const low = Math.min(pose[27][1], pose[28][1], pose[29][1], pose[30][1], pose[31][1], pose[32][1]);
    const drop = Math.max(-0.9 * rig.hipH, Math.min(0, (hip.y - low) * (rig.hipH / 0.95) - rig.hipH));
    rig.root.position.y = rig.baseY + drop; rig.root.updateMatrixWorld(true);
  }
  function drawChar3D(g, s, lt, W, H) {
    drawBgCentered(g, s, W, H);
    if (!AI.three) {
      loadThree().then(() => draw()).catch((e) => setStatus('Không tải được nhân vật 3D: ' + e.message, 'err'));
      g.fillStyle = '#9c938a'; g.font = `500 ${Math.round(H / 28)}px ${FONT}`; g.textAlign = 'center'; g.fillText('Đang tải nhân vật 3D…', 0, 0);
      return;
    }
    const { renderer, scene, camera, rig } = AI.three;
    const data = motionCache[s.mediaId];
    const ch = s.char || { cam: 20, mirror: false };
    const pose = data ? motionFrame(data, Math.round((s.trimStart + lt) * data.fps), ch.mirror, true) : null;
    if (pose) applyPose3D(rig, pose);
    const cvs = renderer.domElement;
    if (cvs.width !== W || cvs.height !== H) renderer.setSize(W, H, false);
    camera.aspect = W / H; camera.updateProjectionMatrix();
    const a = (ch.cam * Math.PI) / 180;
    camera.position.set(Math.sin(a) * 3.7, 1.1, Math.cos(a) * 3.7); camera.lookAt(0, 0.95, 0);
    renderer.render(scene, camera);
    g.drawImage(cvs, -W / 2, -H / 2, W, H);
  }

  async function prepareAI() {
    if (state.scenes.some((s) => s.removeBg)) await loadSeg();
    if (state.scenes.some((s) => { const m = mediaById(s.mediaId); return m && m.kind === 'motion'; })) await loadThree();
  }

  // ----- inspector sections -----
  function aiSections(s, m) {
    const isMotion = m && m.kind === 'motion';
    const imgs = state.media.filter((x) => x.kind === 'image').sort((a, b) => (b.cutout ? 1 : 0) - (a.cutout ? 1 : 0));
    const bg = s.bg || { type: 'color', color: '#1d2430', mediaId: null };
    const bgSel = bg.type === 'media' ? bg.mediaId : 'color';
    let html = '';
    if (isMotion) {
      const ch = s.char || { cam: 20, mirror: false };
      html += `<section><span class="eyebrow">Nhân vật 3D (Blender)</span>
        <div class="rng"><div class="row"><span class="lbl">Góc máy</span><span class="tc" id="x-camV">${ch.cam}°</span></div><input type="range" id="x-cam" min="-180" max="180" step="5" value="${ch.cam}"></div>
        <div class="row"><label for="x-mirror">Đảo trái phải</label><input type="checkbox" id="x-mirror" ${ch.mirror ? 'checked' : ''}></div></section>`;
    } else {
      html += `<section><span class="eyebrow">Tách nền người</span>
        <div class="row"><label for="x-rmbg">Tách người, thay nền</label><input type="checkbox" id="x-rmbg" ${s.removeBg ? 'checked' : ''}></div>
        ${s.removeBg ? '<span class="lbl">Tách nền từng khung hình bằng AI ngay trong trình duyệt (tốt nhất với người).</span>' : ''}</section>`;
    }
    if (isMotion || s.removeBg) {
      html += `<section><span class="eyebrow">Nền phía sau</span>
        <div class="row"><label for="x-bgsel">Nền</label><select class="sel" id="x-bgsel"><option value="color"${bgSel === 'color' ? ' selected' : ''}>Màu trơn</option>${imgs.filter((x) => !x.cutout).map((x) => `<option value="${x.id}"${bgSel === x.id ? ' selected' : ''}>Ảnh: ${esc(x.name.slice(0, 22))}</option>`).join('')}</select></div>
        ${bg.type !== 'media' ? `<div class="row"><label for="x-bgcolor">Màu nền</label><input type="color" id="x-bgcolor" value="${bg.color || '#1d2430'}"></div>` : ''}</section>`;
    }
    const motions = state.media.filter((x) => x.kind === 'motion');
    html += `<section><span class="eyebrow">Nhân vật đặt vào cảnh</span>
      <div class="row"><label for="x-addov">Thêm nhân vật</label><select class="sel" id="x-addov"><option value="">${imgs.length ? 'Chọn ảnh…' : 'Chưa có ảnh'}</option>${imgs.map((x) => `<option value="${x.id}">${x.cutout ? '[Đã tách nền] ' : ''}${esc(x.name.replace(' (đã tách nền)', '').slice(0, 24))}</option>`).join('')}</select></div>
      ${imgs.some((x) => x.cutout) ? '' : '<span class="lbl">Mẹo: bấm nút kéo trên một ảnh trong Thư viện để tách nền nhân vật trước.</span>'}
      ${(s.overlays || []).map((o, i) => {
        const im = mediaById(o.mediaId); const open = openOv === o.id;
        return `<div class="ov-item${open ? ' open' : ''}" data-oid="${o.id}">
          <div class="row"><button class="ov-head" data-ovopen="${o.id}">${im ? `<img src="${im.url}" alt="" class="checker">` : ''} Nhân vật ${i + 1}${o.motionId ? ' · cử động' : ''}</button><button class="ibtn danger" data-ovdel="${o.id}" aria-label="Bỏ nhân vật"><svg class="i"><use href="#i-trash"/></svg></button></div>
          ${open ? `
          ${[['x', 'Ngang', 0, 1, 0.01, '%'], ['y', 'Dọc (chân)', 0.1, 1.2, 0.01, '%'], ['h', 'Cao', 0.1, 1.5, 0.01, '%'], ['rot', 'Xoay', -45, 45, 1, '°'], ['bright', 'Độ sáng', 0.5, 1.5, 0.05, '%']].map(([k, l, mn, mx, st, u]) => `
          <div class="rng"><div class="row"><span class="lbl">${l}</span><span class="tc" data-ovv="${k}">${u === '%' ? Math.round(o[k] * 100) + '%' : o[k] + u}</span></div><input type="range" data-ovk="${k}" data-oid="${o.id}" min="${mn}" max="${mx}" step="${st}" value="${o[k]}"></div>`).join('')}
          <div class="row"><label>Làm theo chuyển động</label><select class="sel" data-ovk="motionId" data-oid="${o.id}"><option value="">${motions.length ? 'Không (ảnh tĩnh)' : 'Chưa có chuyển động'}</option>${motions.map((x) => `<option value="${x.id}"${o.motionId === x.id ? ' selected' : ''}>${esc(x.name.replace('Chuyển động: ', '').slice(0, 22))}</option>`).join('')}</select></div>
          ${o.motionId && o.rig ? `<span class="lbl">${o.rig.estimated ? 'Không nhận ra dáng người trong ảnh, đang dùng khung xương ước lượng (đứng thẳng, tay buông).' : 'Đã nhận ra dáng nhân vật trong ảnh.'}</span>
          <div class="rng"><div class="row"><span class="lbl">Bắt đầu từ giây</span><span class="tc" data-ovv="offset">${(o.offset || 0).toFixed(1)}s</span></div><input type="range" data-ovk="offset" data-oid="${o.id}" min="0" max="${Math.max(0.1, ((mediaById(o.motionId) || {}).duration || 1) - 0.1).toFixed(1)}" step="0.1" value="${o.offset || 0}"></div>
          <div class="row"><label>Đảo trái phải động tác</label><input type="checkbox" data-ovk="mirror" data-oid="${o.id}" ${o.mirror ? 'checked' : ''}></div>` : ''}
          ${!motions.length ? '<span class="lbl">Học chuyển động từ một video trong Thư viện (nút hình người) để nhân vật cử động.</span>' : ''}
          <div class="row"><label>Xuất hiện</label><select class="sel" data-ovk="enter" data-oid="${o.id}">${opts(ENTERS, o.enter)}</select></div>
          <div class="row"><label>Chuyển động nhẹ</label><select class="sel" data-ovk="idle" data-oid="${o.id}">${opts(IDLES, o.idle)}</select></div>
          <div class="row"><label>Bóng đổ</label><input type="checkbox" data-ovk="shadow" data-oid="${o.id}" ${o.shadow ? 'checked' : ''}></div>
          <div class="row"><label>Lật ngang</label><input type="checkbox" data-ovk="flip" data-oid="${o.id}" ${o.flip ? 'checked' : ''}></div>` : ''}
        </div>`;
      }).join('')}</section>`;
    return html;
  }
  let openOv = null;
  const ovOf = (s, oid) => (s.overlays || []).find((o) => o.id === oid);
  $('inspBody').addEventListener('input', (e) => {
    const s = sel(); if (!s) return; const t = e.target;
    if (t.id === 'x-cam') { s.char = Object.assign({ cam: 20, mirror: false }, s.char, { cam: +t.value }); $('x-camV').textContent = t.value + '°'; changed(); return; }
    if (t.id === 'x-bgcolor') { s.bg = Object.assign({ type: 'color' }, s.bg, { type: 'color', color: t.value }); changed(); return; }
    const k = t.dataset.ovk; if (!k || t.type !== 'range') return;
    const o = ovOf(s, t.dataset.oid); if (!o) return;
    o[k] = +t.value;
    const lab = t.closest('.rng').querySelector('[data-ovv]');
    if (lab) lab.textContent = k === 'rot' ? o[k] + '°' : k === 'offset' ? o[k].toFixed(1) + 's' : Math.round(o[k] * 100) + '%';
    changed();
  });
  $('inspBody').addEventListener('change', async (e) => {
    const s = sel(); if (!s) return; const t = e.target;
    if (t.id === 'x-mirror') { s.char = Object.assign({ cam: 20, mirror: false }, s.char, { mirror: t.checked }); changed(); return; }
    if (t.id === 'x-rmbg') { s.removeBg = t.checked; if (!s.bg) s.bg = { type: 'color', color: '#1d2430', mediaId: null }; changed({ insp: true }); if (t.checked) loadSeg().then(() => draw()).catch((er) => setStatus('Không tải được AI tách nền: ' + er.message, 'err')); return; }
    if (t.id === 'x-bgsel') { s.bg = t.value === 'color' ? { type: 'color', color: (s.bg && s.bg.color) || '#1d2430', mediaId: null } : { type: 'media', mediaId: t.value, color: (s.bg && s.bg.color) || '#1d2430' }; changed({ insp: true }); return; }
    if (t.id === 'x-addov') { if (!t.value) return; const o = newOverlay(t.value); s.overlays = (s.overlays || []).concat([o]); openOv = o.id; changed({ insp: true }); seekToScene(state.scenes.indexOf(s)); return; }
    const k = t.dataset.ovk; if (!k || t.type === 'range') return;
    const o = ovOf(s, t.dataset.oid); if (!o) return;
    if (t.type === 'checkbox') o[k] = t.checked;
    else if (k === 'motionId') {
      if (!t.value) { o.motionId = null; changed({ insp: true }); return; }
      setStatus('Đang nhận dạng dáng nhân vật trong ảnh…');
      if (!o.rig) o.rig = await detectRig(o.mediaId);
      o.motionId = t.value; setStatus(o.rig.estimated ? 'Dùng khung xương ước lượng cho nhân vật.' : 'Đã nhận ra dáng nhân vật.', 'ok');
      changed({ insp: true }); return;
    } else o[k] = t.value;
    changed();
  });
  $('inspBody').addEventListener('click', (e) => {
    const s = sel(); if (!s) return;
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.ovopen) { openOv = openOv === b.dataset.ovopen ? null : b.dataset.ovopen; renderInsp(); }
    if (b.dataset.ovdel) { s.overlays = (s.overlays || []).filter((o) => o.id !== b.dataset.ovdel); changed({ insp: true }); }
  });


  // ---------- boot ----------
  async function boot() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { saved = null; }
    const examples = EXAMPLES.map(([id, kind, name]) => ({ id, name, url: exampleImage(kind), example: true }));
    if (saved && Array.isArray(saved.scenes)) {
      state.title = saved.title || state.title; state.aspect = saved.aspect === '9:16' ? '9:16' : '16:9';
      state.media = (saved.media || []).concat(examples); state.scenes = saved.scenes;
    } else {
      state.media = examples; state.scenes = exampleScenes();
    }
    for (const m of state.media) {
      if (m.kind !== 'video' && !m.idb) continue;
      try {
        const blob = await idb.get(m.id);
        if (blob && m.kind === 'motion') { motionCache[m.id] = JSON.parse(await blob.text()); m.url = null; }
        else if (blob) m.url = URL.createObjectURL(blob);
      } catch (e) { /* not stored */ }
    }
    state.media = state.media.filter((m) => (m.kind === 'motion' ? motionCache[m.id] : m.kind !== 'video' && !m.idb) || m.url);
    state.scenes = state.scenes.filter((s) => state.media.some((m) => m.id === s.mediaId));
    state.scenes.forEach((s) => { if (s.trimStart == null) s.trimStart = 0; if (s.volume == null) s.volume = 1; });
    $('title').value = state.title;
    await Promise.all(state.media.map(loadImage));
    selectedId = state.scenes[0] ? state.scenes[0].id : null;
    renderBin(); renderTrack(); renderInsp(); applyAspect(); seek(state.scenes.length ? 1.2 : 0);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  }
  boot();
})();
</script>
